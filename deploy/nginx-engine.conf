# The gate in front of the engine.
#
# Install as /etc/nginx/conf.d/engine.conf, replacing REPLACE_WITH_SHARED_SECRET
# with the value also stored as the front-door Worker's ORIGIN_SECRET.
#
# Why this exists: the engine has no authentication and cannot reasonably have
# any — it is a BitTorrent client, and every self-hosted copy would otherwise
# carry a credential store it does not want. So the public-facing gate lives
# here instead, and the engine stays private on loopback.
#
# This is the second of two locks. The first is the security group, which
# accepts port 8443 only from Cloudflare's published ranges. Neither is
# sufficient alone: the security group cannot tell one Cloudflare customer's
# Worker from another's, and a secret in a header is only as private as the
# transport carrying it.

# The default 64-byte bucket cannot hold a 64-character secret as a map key.
map_hash_bucket_size 128;

map $http_x_engine_secret $engine_ok {
    default 0;
    "REPLACE_WITH_SHARED_SECRET" 1;
}

server {
    listen 8443 default_server;
    server_name _;

    # Verification opens real TCP connections to strangers and is measured at
    # ~7.6s cold, with a caller-settable ceiling above that. The proxy must not
    # give up before the engine does, or a slow-but-succeeding verification
    # comes back as a gateway error.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        if ($engine_ok = 0) { return 403 '{"error":"forbidden"}'; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
